name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CALL_MODE: mock
      ENABLE_REAL_CALLS: 'false'
      EXPO_NO_DOTENV: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          proto-version: '0.57.4'
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - name: Validate offline fixtures and run inherited moon checks
        run: node scripts/verify-fixtures/run.cjs --ci
