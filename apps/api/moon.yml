id: api
layer: application
language: go
dependsOn: ['auth', 'events', 'handlers', 'repository', 'telephony', 'transcription']
tasks:
  dev:
    command: 'go run .'
    options: {cache: false, runInCI: false, persistent: true}
  build:
    command: 'go build -o bin/api .'
    options: {mergeArgs: replace}
    outputs: ['bin']
